<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Counter — Calories</title>
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="app-header">
    <h1>Fitness Counter</h1>
  </header>

  <nav class="tabs" role="tablist">
    <a class="tab-btn" role="tab" aria-selected="false" href="index.html">Weight</a>
    <a class="tab-btn" role="tab" aria-selected="true" href="calories.html">Calories</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="summary.html">Summary</a>
  </nav>

  <main>
    <section class="card sign-in-card" id="sign-in-card" hidden>
      <h2>Sign in required</h2>
      <p>Your data lives in a Google Sheet. Sign in with Google to load it.</p>
      <button type="button" id="sign-in-btn">Sign in with Google</button>
      <p id="auth-message" class="message" role="status"></p>
    </section>

    <div id="app-content" hidden>
      <section class="card date-carousel" id="date-carousel">
        <input type="date" class="date-fallback" aria-label="Jump to date" />
        <button type="button" class="date-nav prev" aria-label="Previous day">‹</button>
        <div class="date-strip"></div>
        <button type="button" class="date-nav next" aria-label="Next day">›</button>
      </section>

      <section class="card">
        <h2>Food</h2>
        <form id="food-form" class="inline-form">
          <input type="text" id="food-name-input" placeholder="What did you eat?" required />
          <input type="number" id="food-kcal-input" step="1" min="0" max="20000" placeholder="kcal" inputmode="numeric" required />
          <button type="submit">Add food</button>
        </form>
        <ul id="food-list" class="food-list"></ul>
        <p class="total-line">Total: <span id="food-total">0</span> kcal</p>
        <p id="sync-message" class="message" role="status"></p>
      </section>

      <section class="card">
        <h2>Calories over time</h2>
        <canvas id="calories-chart" class="chart-canvas"></canvas>
      </section>
    </div>
  </main>

  <script type="module" src="calories.js"></script>
</body>
</html>
