<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Counter — Weight</title>
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Fitness Counter</h1>
  </header>

  <nav class="tabs" role="tablist">
    <a class="tab-btn" role="tab" aria-selected="true" href="index.html">Weight</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="calories.html">Calories</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="summary.html">Summary</a>
  </nav>

  <main>
    <section class="card date-carousel" id="date-carousel">
      <input type="date" class="date-fallback" aria-label="Jump to date" />
      <button type="button" class="date-nav prev" aria-label="Previous day">‹</button>
      <div class="date-strip"></div>
      <button type="button" class="date-nav next" aria-label="Next day">›</button>
    </section>

    <section class="card">
      <h2>Weight</h2>
      <form id="weight-form" class="inline-form">
        <input type="number" id="weight-input" step="0.1" min="20" max="400" placeholder="kg" inputmode="decimal" required />
        <button type="submit">Save weight</button>
      </form>
    </section>

    <section class="card">
      <h2>Weight over time</h2>
      <canvas id="weightChart"></canvas>
    </section>
  </main>

  <script type="module" src="weight.js"></script>
</body>
</html>
