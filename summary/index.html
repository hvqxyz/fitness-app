<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Counter — Summary</title>
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../common/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app-header-slot"></div>
  <script src="../common/app-header.js"></script>

  <nav class="tabs" role="tablist">
    <a class="tab-btn" role="tab" aria-selected="false" href="../weight/index.html">Weight</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../calories/index.html">Calories</a>
    <a class="tab-btn" role="tab" aria-selected="true" href="../summary/index.html">Summary</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../workouts/running/index.html">Workouts</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../performance/index.html">Performance</a>
  </nav>

  <main>
    <section class="card sign-in-card" id="sign-in-card" hidden>
      <h2>Sign in required</h2>
      <p>Your data lives in a Google Sheet. Sign in with Google to load it.</p>
      <button type="button" id="sign-in-btn" class="button">Sign in with Google</button>
      <p id="auth-message" class="message" role="status"></p>
    </section>

    <div id="app-content" hidden>
      <section class="card">
        <h2>Profile</h2>
        <form id="profile-form" class="inline-form">
          <input type="number" id="profile-age-input" step="1" min="1" max="120" placeholder="Age" inputmode="numeric" />
          <input type="number" id="profile-height-input" step="0.1" min="50" max="272" placeholder="Height (cm)" inputmode="decimal" />
          <button type="submit" class="button">Save profile</button>
        </form>
        <p id="profile-message" class="message" role="status"></p>
      </section>

      <section class="card">
        <h2>Targets</h2>
        <form id="targets-form" class="ingredient-form">
          <input type="number" id="target-kcal-input" placeholder="Target calories / day" step="1" min="0" inputmode="numeric" />
          <div class="ingredient-grid">
            <input type="number" id="target-protein-input" placeholder="Protein %" step="1" min="0" max="100" inputmode="numeric" />
            <input type="number" id="target-carbs-input" placeholder="Carbs %" step="1" min="0" max="100" inputmode="numeric" />
            <input type="number" id="target-fat-input" placeholder="Fat %" step="1" min="0" max="100" inputmode="numeric" />
          </div>
          <p id="targets-percent-hint" class="ingredient-sub"></p>
          <button type="submit" class="button">Save targets</button>
        </form>
        <p id="targets-message" class="message" role="status"></p>
      </section>

      <section class="card">
        <h2>Food Database</h2>
        <form id="ingredient-form" class="ingredient-form">
          <div class="food-search" id="ingredient-name-search">
            <input type="text" class="food-search-input" id="ingredient-name-input" placeholder="Food name" autocomplete="off" required />
            <ul class="food-search-results" hidden></ul>
          </div>
          <p id="ingredient-message" class="message" role="status"></p>
          <div class="ingredient-grid">
            <input type="number" id="ingredient-kcal-input" placeholder="Kcal /100g" step="0.1" min="0" required />
            <input type="number" id="ingredient-fiber-input" placeholder="Fiber /100g" step="0.1" min="0" />
            <input type="number" id="ingredient-carbs-input" placeholder="Carbs /100g" step="0.1" min="0" />
            <input type="number" id="ingredient-satfat-input" placeholder="Sat fat /100g" step="0.1" min="0" />
            <input type="number" id="ingredient-unsatfat-input" placeholder="Unsat fat /100g" step="0.1" min="0" />
            <input type="number" id="ingredient-protein-input" placeholder="Protein /100g" step="0.1" min="0" />
          </div>
          <button type="submit" class="button">Add food</button>
        </form>
        <button id="open-ingredients-sheet-btn" type="button" class="button secondary">Open in Google Sheets</button>
      </section>

      <dialog id="ingredient-detail-modal" class="ingredient-modal">
        <h3 id="ingredient-modal-name"></h3>
        <dl id="ingredient-modal-detail" class="ingredient-modal-detail"></dl>
        <div class="ingredient-modal-actions">
          <button type="button" id="ingredient-modal-delete" class="button delete-day">Remove</button>
          <button type="button" id="ingredient-modal-close" class="button secondary">Close</button>
        </div>
      </dialog>

      <section class="card">
        <h2>Gym Templates</h2>
        <div class="range-toggle" id="gym-template-toggle">
          <button type="button" class="button range-btn" data-template="Training A" aria-pressed="true">Training A</button>
          <button type="button" class="button range-btn" data-template="Training B" aria-pressed="false">Training B</button>
        </div>
        <form id="gym-exercise-form" class="ingredient-form">
          <select id="gym-exercise-name-input" required>
            <option value="" disabled selected>Choose exercise</option>
          </select>
          <input type="number" id="gym-exercise-target-reps-input" placeholder="Target reps" step="1" min="0" inputmode="numeric" />
          <input type="number" id="gym-exercise-target-sets-input" placeholder="Target sets" step="1" min="0" inputmode="numeric" />
          <button type="submit" class="button">Add exercise</button>
        </form>
        <p class="ingredient-sub">Manage the exercise list on the Profile page.</p>
        <ul id="gym-exercise-list" class="food-list"></ul>
        <p id="gym-exercise-message" class="message" role="status"></p>
      </section>

      <section class="card">
        <h2>History</h2>
        <div class="table-wrap">
          <table id="history-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Weight</th>
                <th>Kcal</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
        <button id="open-sheet-btn" type="button" class="button secondary">Open in Google Sheets</button>
      </section>

      <section class="card">
        <h2>Backup</h2>
        <div class="inline-form">
          <button id="export-btn" type="button" class="button">Export data</button>
          <button id="import-btn" type="button" class="button secondary">Import data</button>
          <input type="file" id="import-file" accept="application/json" hidden />
        </div>
        <p id="backup-message" class="message" role="status"></p>
      </section>
    </div>
  </main>

  <script type="module" src="summary.js"></script>
</body>
</html>
