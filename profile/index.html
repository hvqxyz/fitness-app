<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Counter — Profile</title>
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../common/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app-header-slot"></div>
  <script src="../common/app-header.js"></script>

  <nav class="tabs" role="tablist">
    <a class="tab-btn" role="tab" aria-selected="false" href="../weight/index.html">Weight</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../calories/index.html">Calories</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../summary/index.html">Summary</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../workouts/running/index.html">Workouts</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../performance/index.html">Performance</a>
  </nav>

  <main>
    <section class="card sign-in-card" id="sign-in-card" hidden>
      <h2>Sign in required</h2>
      <p>Your data lives in a Google Sheet. Sign in with Google to load it.</p>
      <button type="button" id="sign-in-btn" class="button">Sign in with Google</button>
      <p id="auth-message" class="message" role="status"></p>
    </section>

    <div id="app-content" hidden>
      <section class="stat-grid">
        <div class="stat-tile">
          <div class="stat-label">Age</div>
          <div class="stat-value" id="age-value">—</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Height</div>
          <div class="stat-value" id="height-value">—</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">BMI</div>
          <div class="stat-value" id="bmi-value">—</div>
          <div class="stat-sub" id="bmi-sub"></div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Calorie target</div>
          <div class="stat-value" id="target-kcal-value">—</div>
        </div>
      </section>

      <section class="card">
        <h2>Gym Exercises</h2>
        <form id="exercise-form" class="inline-form">
          <input type="text" id="exercise-name-input" placeholder="Exercise name (e.g. Bench Press)" required />
          <button type="submit" class="button">Add exercise</button>
        </form>
        <ul id="exercise-list" class="food-list"></ul>
        <p id="exercise-message" class="message" role="status"></p>
      </section>
    </div>
  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
