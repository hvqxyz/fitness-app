<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Counter — Summary</title>
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Fitness Counter</h1>
  </header>

  <nav class="tabs" role="tablist">
    <a class="tab-btn" role="tab" aria-selected="false" href="index.html">Weight</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="calories.html">Calories</a>
    <a class="tab-btn" role="tab" aria-selected="true" href="summary.html">Summary</a>
  </nav>

  <main>
    <section class="card">
      <h2>History</h2>
      <div class="table-wrap">
        <table id="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Weight</th>
              <th>Kcal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <button id="show-more" type="button" class="secondary" hidden>Show more</button>
    </section>

    <section class="card">
      <h2>Backup</h2>
      <div class="inline-form">
        <button id="export-btn" type="button">Export data</button>
        <button id="import-btn" type="button" class="secondary">Import data</button>
        <input type="file" id="import-file" accept="application/json" hidden />
      </div>
      <p id="backup-message" class="message" role="status"></p>
    </section>
  </main>

  <script type="module" src="summary.js"></script>
</body>
</html>
