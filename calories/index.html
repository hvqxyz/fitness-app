<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fitness Counter — Calories</title>
  <meta name="theme-color" content="#2a78d6" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../common/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app-header-slot"></div>
  <script src="../common/app-header.js"></script>

  <nav class="tabs" role="tablist">
    <a class="tab-btn" role="tab" aria-selected="false" href="../weight/index.html">Weight</a>
    <a class="tab-btn" role="tab" aria-selected="true" href="../calories/index.html">Calories</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../workouts/running/index.html">Workouts</a>
    <a class="tab-btn" role="tab" aria-selected="false" href="../performance/index.html">Performance</a>
  </nav>

  <main>
    <section class="card sign-in-card" id="sign-in-card" hidden>
      <h2>Sign in required</h2>
      <p>Your data lives in a Google Sheet. Sign in with Google to load it.</p>
      <button type="button" id="sign-in-btn" class="button">Sign in with Google</button>
      <p id="auth-message" class="message" role="status"></p>
    </section>


    <div id="app-content" hidden>
      <section class="card date-carousel" id="date-carousel">
        <input type="date" class="date-fallback" aria-label="Jump to date" />
        <button type="button" class="button date-nav prev" aria-label="Previous day">‹</button>
        <div class="date-strip"></div>
        <button type="button" class="button date-nav next" aria-label="Next day">›</button>
      </section>

      <div class="range-toggle" id="calories-subnav">
        <button type="button" class="button range-btn" data-view="Tracker" aria-pressed="true">Tracker</button>
        <button type="button" class="button range-btn" data-view="Analytics" aria-pressed="false">Analytics</button>
      </div>

      <div id="calories-tracker-view" class="calorie-progress-tile">
        <section class="card calorie-summary-card">
          <p id="calorie-progress-loading" class="tile-loading" role="status">Loading…</p>
          <div id="calorie-progress" class="progress-bar" hidden>
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="calorie-progress-fill"></div>
            </div>
            <p class="progress-bar-label" id="calorie-progress-label"></p>
          </div>
          <p id="calorie-total-line" class="total-line" hidden>Today's total: <span id="food-total">0</span> kcal</p>
          <div id="macro-rings" class="macro-rings" hidden>
            <div class="macro-ring-item" id="protein-ring-item">
              <canvas class="macro-ring-canvas" id="protein-ring"></canvas>
              <p class="macro-ring-label">Protein</p>
            </div>
            <div class="macro-ring-item" id="carbs-ring-item">
              <canvas class="macro-ring-canvas" id="carbs-ring"></canvas>
              <p class="macro-ring-label">Carbs</p>
            </div>
            <div class="macro-ring-item" id="fat-ring-item">
              <canvas class="macro-ring-canvas" id="fat-ring"></canvas>
              <p class="macro-ring-label">Fat</p>
            </div>
          </div>
          <p id="sync-message" class="message" role="status"></p>
        </section>

        <div id="meal-sections"></div>

        <dialog id="copy-meal-modal" class="ingredient-modal">
          <form id="copy-meal-form" class="copy-meal-form">
            <h3 id="copy-meal-title">Copy meal</h3>
            <label>
              Day
              <input type="date" id="copy-meal-date" required />
            </label>
            <label>
              Meal type
              <select id="copy-meal-type" class="select-list" required></select>
            </label>last avg weight
            <p id="copy-meal-message" class="message" role="status"></p>
            <div class="ingredient-modal-actions">
              <button type="submit" id="copy-meal-submit" class="button">Copy</button>
              <button type="button" id="copy-meal-cancel" class="button secondary">Cancel</button>
            </div>
          </form>
        </dialog>
      </div>

      <div id="calories-analytics-view" hidden>
        <section class="card">
          <h2>Calories over time</h2>
          <div class="range-toggle" id="chart-range-toggle">
            <button type="button" class="button range-btn" data-range="7" aria-pressed="false">7 days</button>
            <button type="button" class="button range-btn" data-range="30" aria-pressed="true">30 days</button>
            <button type="button" class="button range-btn" data-range="90" aria-pressed="false">90 days</button>
          </div>
          <div class="chart-wrap calories-chart-wrap">
            <canvas id="calories-chart"></canvas>
            <p class="chart-loading" id="calories-chart-loading">Loading…</p>
          </div>
        </section>
        <section class="card" style="margin-top: 10px">
          <h2>Analytics by weeks</h2>
          <div class="date-carousel" id="week-carousel">
            <input type="date" class="date-fallback" aria-label="Jump to week" />
            <button type="button" class="button date-nav prev" aria-label="Previous week">‹</button>
            <div class="date-strip"></div>
            <button type="button" class="button date-nav next" aria-label="Next week">›</button>
          </div>

          <div class="week-macro-item">
            <p class="total-line">Calories</p>
            <div class="progress-bar" id="week-calories-progress">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="week-calories-progress-fill"></div>
              </div>
              <p class="progress-bar-label" id="week-calories-progress-label"></p>
            </div>
          </div>

          <div class="week-macro-item">
            <p class="total-line">Protein</p>
            <div class="progress-bar" id="week-protein-progress">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="week-protein-progress-fill"></div>
              </div>
              <p class="progress-bar-label" id="week-protein-progress-label"></p>
            </div>
          </div>

          <div class="week-macro-item">
            <p class="total-line">Carbs</p>
            <div class="progress-bar" id="week-carbs-progress">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="week-carbs-progress-fill"></div>
              </div>
              <p class="progress-bar-label" id="week-carbs-progress-label"></p>
            </div>
          </div>

          <div class="week-macro-item">
            <p class="total-line">Fat</p>
            <div class="progress-bar" id="week-fat-progress">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="week-fat-progress-fill"></div>
              </div>
              <p class="progress-bar-label" id="week-fat-progress-label"></p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="calories.js"></script>
</body>
</html>
